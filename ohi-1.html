<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ohi</title>
<meta name="description" content="নামাজের সময়, রমজান ক্যালেন্ডার, কুরআন, সহীহ হাদিস ও মাসআলা-মাসায়েল">
<meta name="theme-color" content="#0E5A4B" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F3D34" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla&family=Noto+Naskh+Arabic:wght@500&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
img{max-width:100%}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}

/* Layout: mobile app shell. Green hero band with Hijri date and next-prayer countdown, four tabs switched by a fixed bottom bar. */
:root{
  --bg:#F1F5F1; --surface:#FFFFFF; --surface2:#E7EEE9; --ink:#13231D; --muted:#566A62; --line:#D3DED7;
  --primary:#0E5A4B; --on-primary:#FFFFFF; --accent:#8A5A0B; --accent-soft:#F4E8CC;
  --hero1:#0E5A4B; --hero2:#093D34; --hero-ink:#FFFFFF; --hero-soft:rgba(255,255,255,.72); --hero-gold:#F0C96A;
  --font-body:'Hind Siliguri',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-display:'Tiro Bangla','Hind Siliguri',serif;
  --font-ar:'Noto Naskh Arabic','Traditional Arabic',serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1310; --surface:#12201B; --surface2:#1A2B25; --ink:#E5EEE9; --muted:#97ACA3; --line:#26392F;
    --primary:#52C7A5; --on-primary:#06231B; --accent:#E3B652; --accent-soft:#3A2F14;
    --hero1:#0F3D34; --hero2:#09231E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1310; --surface:#12201B; --surface2:#1A2B25; --ink:#E5EEE9; --muted:#97ACA3; --line:#26392F;
  --primary:#52C7A5; --on-primary:#06231B; --accent:#E3B652; --accent-soft:#3A2F14;
  --hero1:#0F3D34; --hero2:#09231E; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
.wrap{width:100%;max-width:640px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance}
p{margin:0}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}

/* hero */
.hero{margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:18px;color:var(--hero-ink);background:linear-gradient(160deg,var(--hero1),var(--hero2))}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:.01em}
.moon{width:22px;height:22px;border-radius:50%;box-shadow:inset -7px -2px 0 0 var(--hero-gold);transform:rotate(-25deg);flex:none}
.citysel{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:99px;padding:5px 30px 5px 14px;font-size:14px;appearance:none;-webkit-appearance:none;max-width:48vw;
  background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.citysel option{color:#13231D;background:#fff}
.hdate{font-family:var(--font-display);font-size:clamp(26px,7.4vw,34px);line-height:1.25;margin-top:16px}
.gdate{color:var(--hero-soft);font-size:15px;margin-top:2px}
.nextbox{margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:10px 14px}
.nextbox small{display:block;color:var(--hero-soft);font-size:13px;line-height:1.3}
.nextbox b{font-weight:600;font-size:17px}
.count{font-variant-numeric:tabular-nums;font-size:20px;font-weight:600;color:var(--hero-gold);white-space:nowrap}

/* layout pieces */
main{padding-block:18px 8px}
.tab{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.card h2{font-size:20px;margin-bottom:6px}
.sub{color:var(--muted);font-size:14px}
.note{color:var(--muted);font-size:13.5px;line-height:1.55}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile small{color:var(--muted);font-size:13px;display:block}
.tile b{font-family:var(--font-display);font-weight:400;font-size:26px;display:block;line-height:1.3;margin-top:2px}
.tile span{font-size:14px;color:var(--muted)}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .t{font-variant-numeric:tabular-nums}
.prow.next{color:var(--primary);font-weight:600}
.tag{display:inline-block;font-size:12px;line-height:1.5;padding:0 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.g{background:var(--surface2);color:var(--primary)}
.btn{background:var(--primary);color:var(--on-primary);border:0;border-radius:10px;padding:8px 14px;font-weight:500;cursor:pointer}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface2);color:var(--ink);border:0;border-radius:99px;padding:6px 14px;font-size:14.5px;cursor:pointer}
.link{background:none;border:0;color:var(--primary);font-weight:500;cursor:pointer;padding:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}

/* ramadan table */
.rscroll{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
.rrow{display:grid;grid-template-columns:2.4rem minmax(7.5rem,1fr) 4.2rem 4.2rem;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;min-width:19rem}
.rrow.h{color:var(--muted);font-size:13px;position:sticky;top:0}
.rrow .n{font-family:var(--font-display);font-size:18px;color:var(--primary)}
.rrow .d small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3}
.rrow .tm{font-variant-numeric:tabular-nums;text-align:right}
.rrow.today{background:var(--accent-soft);border-radius:10px;padding-inline:8px;margin-inline:-8px}
.rrow.last10 .n{color:var(--accent)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:14px;color:var(--muted)}
.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.dua{border-top:1px solid var(--line);padding:12px 0}
.dua:first-of-type{border-top:0}
.ar{font-family:var(--font-ar);font-size:22px;line-height:2.05;direction:rtl;text-align:right}

/* days */
.ev{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.dblock{background:var(--surface2);border-radius:10px;text-align:center;padding:6px 2px;align-self:start}
.dblock b{font-family:var(--font-display);font-weight:400;font-size:24px;display:block;line-height:1.1}
.dblock small{font-size:12px;color:var(--muted);display:block;line-height:1.3}
.ev.today .dblock{background:var(--primary);color:var(--on-primary)}
.ev.today .dblock small{color:inherit}
.ev h3{font-family:var(--font-body);font-weight:600;font-size:16.5px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.ev .when{font-size:14px;color:var(--primary);font-weight:500}
.ul{margin:6px 0 0;padding-left:1.2em}
.ul li{margin:3px 0}

/* masail */
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px}
.cat h2{font-size:21px;margin-bottom:2px}
details.acc{border-bottom:1px solid var(--line)}
details.acc:last-child{border-bottom:0}
details.acc summary{list-style:none;cursor:pointer;padding:12px 0;font-weight:500;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:'+';color:var(--primary);font-size:20px;line-height:1.3;flex:none}
details.acc[open] summary::after{content:'−'}
details.acc .ans{padding:0 0 14px;color:var(--ink)}
details.acc .ans p+p{margin-top:8px}
.ans b{font-weight:600}
.warn{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px}
.zres{background:var(--surface2);border-radius:12px;padding:12px 14px;margin-top:12px}
.zres b{font-family:var(--font-display);font-weight:400;font-size:26px;color:var(--primary)}
.zgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;color:var(--muted);padding:24px 0}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.navin{max-width:640px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:12.5px;min-width:0}
.nav a svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a[aria-current="page"]{color:var(--primary);font-weight:600;background:var(--surface2)}
@media (prefers-reduced-motion:no-preference){.tab:not([hidden]){animation:in .22s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}


/* ---- Ohi additions ---- */
.navin{grid-template-columns:repeat(5,1fr)!important}
.nav a{font-size:11.5px!important;padding:6px 2px!important}
.btn-tile{text-align:left;cursor:pointer;color:inherit;font:inherit;width:100%}
.btn-tile b{color:var(--primary)}
.sw{display:flex;gap:12px;align-items:center;padding:8px 0}
.sw input{width:22px;height:22px;accent-color:var(--primary);flex:none}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;z-index:30;max-width:90vw;text-align:center}

/* quran + hadith lists */
.srow{display:grid;grid-template-columns:2.6rem minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer;color:inherit;font:inherit}
.srow:last-child{border-bottom:0}
.snum{width:2.4rem;height:2.4rem;display:grid;place-items:center;border-radius:10px;background:var(--surface2);color:var(--primary);font-weight:600;font-size:15px}
.srow b{font-weight:600;display:block;line-height:1.35}
.srow small{color:var(--muted);font-size:13px;display:block;line-height:1.35}
.sar{font-family:var(--font-ar);font-size:22px;color:var(--primary)}
.qbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px;display:flex;flex-direction:column;gap:8px}
.qctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.qctl .btn{padding:6px 12px}
.ay{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-width:0}
.ay.mark{border-color:var(--accent)}
.ayhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ayn{min-width:2rem;height:2rem;padding:0 6px;display:inline-grid;place-items:center;border-radius:99px;background:var(--surface2);color:var(--primary);font-size:14px;font-weight:600}
.ayhead .grow{flex:1}
.mini{background:var(--surface2);border:0;border-radius:99px;padding:3px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.mini.on{background:var(--primary);color:var(--on-primary)}
.ar.q{font-size:calc(27px * var(--qfs,1));line-height:2.2}
.bntxt{font-size:calc(16px * var(--qfs,1));margin-top:6px;white-space:pre-line}
.hd .ar{font-size:22px;line-height:2.1}
.hd .bntxt{font-size:16px;margin-top:8px}
.hd .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:4px}
.err{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14.5px}
.loading{color:var(--muted);text-align:center;padding:22px 0}

</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="hero-top">
      <div class="brand"><span class="moon" aria-hidden="true"></span>Ohi</div>
      <select id="city" class="citysel" aria-label="শহর বেছে নিন"></select>
    </div>
    <div class="hdate" id="hdate"></div>
    <div class="gdate" id="gdate"></div>
    <div class="nextbox">
      <div><small>পরবর্তী নামাজ</small><b id="nname">—</b> <span id="ntime" style="font-size:14px;color:var(--hero-soft)"></span></div>
      <div class="count" id="ncount">--:--:--</div>
    </div>
  </div>
</header>
<main class="wrap">
  <section id="tab-home" class="tab"></section>
  <section id="tab-quran" class="tab" hidden></section>
  <section id="tab-hadith" class="tab" hidden></section>
  <section id="tab-ramadan" class="tab" hidden></section>
  <section id="tab-masail" class="tab" hidden></section>
  <section id="tab-days" class="tab" hidden></section>
</main>
<nav class="nav" aria-label="প্রধান মেনু"><div class="navin">
  <a href="#home" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>হোম</a>
  <a href="#quran" data-tab="quran"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 19v2H6M9 8h6M9 12h6"/></svg>কুরআন</a>
  <a href="#hadith" data-tab="hadith"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></svg>হাদিস</a>
  <a href="#ramadan" data-tab="ramadan"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>রমজান</a>
  <a href="#masail" data-tab="masail"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/></svg>মাসআলা</a>
</div></nav>
<script>

/* ---------- helpers ---------- */
var BN='০১২৩৪৫৬৭৮৯';
function bn(s){return String(s).replace(/\d/g,function(d){return BN[d]})}
function en(s){return String(s).replace(/[০-৯]/g,function(d){return BN.indexOf(d)})}
function pad(n){return n<10?'0'+n:''+n}
function $(id){return document.getElementById(id)}
var WD=['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
var WDS=['রবি','সোম','মঙ্গল','বুধ','বৃহ','শুক্র','শনি'];
var GM=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
var HM=['মুহাররম','সফর','রবিউল আউয়াল','রবিউস সানি','জমাদিউল আউয়াল','জমাদিউস সানি','রজব','শাবান','রমজান','শাওয়াল','জিলকদ','জিলহজ'];
var CITIES=[
 {id:'dhaka',n:'ঢাকা',lat:23.8103,lng:90.4125,tz:6,off:1},
 {id:'ctg',n:'চট্টগ্রাম',lat:22.3569,lng:91.7832,tz:6,off:1},
 {id:'sylhet',n:'সিলেট',lat:24.8949,lng:91.8687,tz:6,off:1},
 {id:'rajshahi',n:'রাজশাহী',lat:24.3745,lng:88.6042,tz:6,off:1},
 {id:'khulna',n:'খুলনা',lat:22.8456,lng:89.5403,tz:6,off:1},
 {id:'barishal',n:'বরিশাল',lat:22.7010,lng:90.3535,tz:6,off:1},
 {id:'rangpur',n:'রংপুর',lat:25.7439,lng:89.2752,tz:6,off:1},
 {id:'mymensingh',n:'ময়মনসিংহ',lat:24.7471,lng:90.4203,tz:6,off:1},
 {id:'doha',n:'দোহা',lat:25.2854,lng:51.5310,tz:3,off:0},
 {id:'riyadh',n:'রিয়াদ',lat:24.7136,lng:46.6753,tz:3,off:0},
 {id:'makkah',n:'মক্কা',lat:21.3891,lng:39.8579,tz:3,off:0},
 {id:'dubai',n:'দুবাই',lat:25.2048,lng:55.2708,tz:4,off:0}
];
var S={city:'dhaka',k:null,rs:null};
try{var sv=JSON.parse(localStorage.getItem('islamic-guide')||'{}');for(var kk in sv)S[kk]=sv[kk]}catch(e){}
function save(){try{localStorage.setItem('islamic-guide',JSON.stringify(S))}catch(e){}}
function city(){for(var i=0;i<CITIES.length;i++)if(CITIES[i].id===S.city)return CITIES[i];return CITIES[0]}
function K(){return S.k==null?city().off:S.k}
function nowLocal(){var c=city(),ms=Date.now()+c.tz*36e5;return{dn:Math.floor(ms/864e5),hrs:(ms%864e5)/36e5}}
function gparts(dn){var d=new Date(dn*864e5);return{y:d.getUTCFullYear(),m:d.getUTCMonth(),d:d.getUTCDate(),w:d.getUTCDay()}}
function gstr(dn){var p=gparts(dn);return bn(p.d)+' '+GM[p.m]+' '+bn(p.y)}
function iso(dn){var p=gparts(dn);return p.y+'-'+pad(p.m+1)+'-'+pad(p.d)}

/* ---------- Hijri ---------- */
var fmtH=null;try{fmtH=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{timeZone:'UTC',day:'numeric',month:'numeric',year:'numeric'})}catch(e){}
function civil(dn){var jd=dn+2440588,l=jd-1948440+10632,n=Math.floor((l-1)/10631);l=l-10631*n+354;
 var j=Math.floor((10985-l)/5316)*Math.floor(50*l/17719)+Math.floor(l/5670)*Math.floor(43*l/15238);
 l=l-Math.floor((30-j)/15)*Math.floor(17719*j/50)-Math.floor(j/16)*Math.floor(15238*j/43)+29;
 var m=Math.floor(24*l/709);return{y:30*n+j-30,m:m,d:l-Math.floor(709*m/24)}}
var hcache={};
function hijriRaw(dn){if(hcache[dn])return hcache[dn];var r=null;
 try{if(fmtH){var p=fmtH.formatToParts(new Date(dn*864e5)),g=function(t){for(var i=0;i<p.length;i++)if(p[i].type===t)return parseInt(p[i].value,10);return NaN};

  '<div class="btns">'+(perm==='default'?'<button class="btn" id="a-perm">নোটিফিকেশনের অনুমতি দিন</button>':'')+(perm==='denied'?'<span class="note">নোটিফিকেশন বন্ধ আছে। ব্রাউজারের সেটিংস থেকে চালু করুন।</span>':'')+
  '<button class="btn ghost" id="a-test">আজান পরীক্ষা করুন</button></div>'+
  '<div class="field" style="margin-top:12px"><label for="a-file">আজানের অডিও ফাইল (ঐচ্ছিক)</label><input class="inp" type="file" id="a-file" accept="audio/*"></div>'+
  '<p class="note" style="margin-top:6px">'+(adhanUrl?'আপনার বেছে নেওয়া আজান বসানো আছে।':'ফাইল না দিলে সাধারণ ঘণ্টাধ্বনি বাজবে।')+'</p>'+
  (adhanUrl?'<div class="btns"><button class="btn ghost" id="a-clear">ফাইল সরান</button></div>':'')+
  (deferredInstall?'<div class="btns"><button class="btn" id="a-install">ফোনে অ্যাপ হিসেবে ইনস্টল করুন</button></div>':'')+
  '<p class="note" style="margin-top:10px">অ্যাপ খোলা বা চালু থাকা অবস্থায় আজান ও রিমাইন্ডার বাজবে। অ্যাপ সম্পূর্ণ বন্ধ থাকলে ব্রাউজার এগুলো চালাতে দেয় না। সেজন্য পরের ধাপে নেটিভ অ্যাপ লাগবে।</p></div>';
 $('a-on').onchange=function(){A.on=this.checked;asave()};
 $('a-notif').onchange=function(){A.notif=this.checked;asave()};
 var pe=$('a-perm');if(pe)pe.onclick=function(){Notification.requestPermission().then(renderSettings)};
 $('a-test').onclick=function(){playAdhan()};
 $('a-file').onchange=function(){var f=this.files&&this.files[0];if(!f)return;idbSet('adhan',f).then(function(){adhanUrl=URL.createObjectURL(f);renderSettings();toast('আজানের ফাইল বসানো হয়েছে')}).catch(function(){toast('ফাইল সংরক্ষণ করা যায়নি')})};
 var cl=$('a-clear');if(cl)cl.onclick=function(){idbSet('adhan',null).then(function(){adhanUrl=null;renderSettings()})};
 var ins=$('a-install');if(ins)ins.onclick=function(){deferredInstall.prompt();deferredInstall.userChoice.then(function(){deferredInstall=null;renderSettings()})}}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredInstall=e;renderSettings()});
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});

/* ---------- shell ---------- */
var TABS=['home','quran','hadith','ramadan','masail','days'];
function curTab(){var h=location.hash.slice(1);return TABS.indexOf(h)>-1?h:'home'}
function showTab(){var t=curTab();TABS.forEach(function(x){$('tab-'+x).hidden=x!==t});
 document.querySelectorAll('.nav a').forEach(function(a){if(a.dataset.tab===(t==='days'?'home':t))a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')})}
function go(t){if(location.hash==='#'+t){showTab();window.scrollTo(0,0)}else location.hash='#'+t}
function openCat(id){go('masail');setTimeout(function(){var s=$('cat-'+id);if(s){var d=s.querySelector('details.acc');if(d)d.open=true;s.scrollIntoView({behavior:'smooth',block:'start'})}},60)}
function renderAll(){renderHero();renderHome();renderRamadan();renderDays();lastNext=tickCount();lastDn=nowLocal().dn}
window.addEventListener('hashchange',function(){showTab();window.scrollTo(0,0)});
document.addEventListener('click',function(e){var b=e.target.closest('[data-go],[data-cat]');if(!b)return;if(b.dataset.cat)openCat(b.dataset.cat);else go(b.dataset.go)});
(function init(){
 var sel=$('city');sel.innerHTML=CITIES.map(function(c){return '<option value="'+c.id+'">'+c.n+'</option>'}).join('');sel.value=city().id;
 sel.onchange=function(){S.city=this.value;S.k=null;save();renderAll()};
 renderMasail();renderAll();renderQuran();renderHadith();loadAdhan();showTab();
 setInterval(function(){checkPrayers();var n=nowLocal();if(n.dn!==lastDn){renderAll();return}var nm=tickCount();if(nm!==lastNext){lastNext=nm;renderHome()}},1000);
})();

</script>
</body>
</html>
